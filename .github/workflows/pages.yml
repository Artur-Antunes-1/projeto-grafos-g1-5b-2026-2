name: Publicar labirinto no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - out/parte1/labirinto_interativo.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar somente o site interativo
        shell: bash
        run: |
          mkdir -p _site
          cp out/parte1/labirinto_interativo.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
